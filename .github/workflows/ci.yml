name: ci

on:
  push:
  pull_request:

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lupa
      - name: Lua syntax
        run: python scripts/check_lua_syntax.py
      - name: Mocked-API smoke test (12 seeds, with and without the Java engine)
        run: python tests/run_mock.py 12
      - name: Line coverage of the smoke test
        run: python tests/coverage.py

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Committed jar must match the committed sources
        run: ./scripts/check_jar_fresh.sh
      - name: Build EchoesEngine against stubs and run self-tests
        run: ./engine/build.sh
